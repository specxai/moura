name: CI

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and release checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Generate and verify Allure results
        if: always() && steps.install.outcome == 'success'
        run: pnpm test:allure

      - name: Generate Allure HTML report
        if: always() && hashFiles('allure-results/*-result.json') != ''
        run: pnpm report:allure

      - name: Build
        id: build
        if: always() && steps.install.outcome == 'success'
        run: pnpm build

      - name: Test installed package
        if: always() && steps.install.outcome == 'success'
        run: pnpm test:package

      - name: Validate Moura repository
        if: always() && steps.build.outcome == 'success'
        run: node dist/cli.js validate .

      - name: Generate Moura Requirement Coverage report
        if: always() && steps.build.outcome == 'success'
        run: pnpm report:moura

      - name: Verify Moura Requirement Coverage report identity
        if: always() && hashFiles('moura-report/index.html') != ''
        run: |
          test -f moura-report/index.html
          grep -F 'REQ-001/SCN-001/CASE-001' moura-report/index.html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Moura Requirement Coverage report
        if: always() && hashFiles('moura-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: moura-report
          path: moura-report/
          retention-days: 14
          if-no-files-found: error

      - name: Moura self-check
        if: always() && steps.build.outcome == 'success'
        run: node dist/cli.js check . --strict-traceability

      - name: Write quality job summary
        run: pnpm quality:summary

      - name: Fixture check smoke
        run: node dist/cli.js check test/fixtures/passing-project

      - name: Check package contents
        run: pnpm pack --dry-run

      - name: Assemble quality site
        run: pnpm quality:site

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy-pages:
    name: Deploy quality reports
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - windows-smoke
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  windows-smoke:
    name: Windows report and package smoke
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Allure results
        run: pnpm test:allure

      - name: Generate Allure HTML report
        run: pnpm report:allure

      - name: Test installed package
        run: pnpm test:package
