name: CI

on:
  workflow_dispatch: {}
  pull_request: {}
  push:
    branches: [main]
  # Completion follows the success-artifact upload, including on reruns.
  # No dispatch credential or producer write permission is needed.
  workflow_run:
    workflows: [Generate Japanese views]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  # Failed producer completions skip every job and must not cancel main CI.
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success' && format('-ignored-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and release checks
    if: >-
      github.event_name != 'workflow_run' ||
      (github.repository == 'specxai/moura' &&
       github.ref == 'refs/heads/main' &&
       github.event.workflow_run.repository.full_name == 'specxai/moura' &&
       github.event.workflow_run.head_repository.full_name == 'specxai/moura' &&
       github.event.workflow_run.path == '.github/workflows/japanese-views.yml' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.status == 'completed' &&
       github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # For workflow_run, github.sha is the trusted default-branch commit
          # at refresh time, never the producer's head_sha or artifact content.
          ref: ${{ github.event_name == 'workflow_run' && github.sha || '' }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Type-check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Generate and verify Allure results
        if: always() && steps.install.outcome == 'success'
        run: pnpm test:allure

      - name: Generate Allure HTML report
        if: always() && hashFiles('allure-results/*-result.json') != ''
        run: pnpm report:allure

      - name: Build
        id: build
        if: always() && steps.install.outcome == 'success'
        run: pnpm build

      - name: Test installed package
        if: always() && steps.install.outcome == 'success'
        run: pnpm test:package

      - name: Test Vitest and Allure onboarding example
        if: always() && steps.install.outcome == 'success'
        run: pnpm test:onboarding

      - name: Validate Moura repository
        if: always() && steps.build.outcome == 'success'
        run: node dist/cli.js validate .

      - name: Generate Moura Requirement Coverage report
        if: always() && steps.build.outcome == 'success'
        run: pnpm report:moura

      - name: Verify Moura Requirement Coverage report identity
        if: always() && hashFiles('moura-report/index.html') != ''
        run: |
          test -f moura-report/index.html
          grep -F 'Overall Status' moura-report/index.html
          grep -F 'REQ-001/SCN-001/CASE-001' moura-report/moura/index.html

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Moura Requirement Coverage report
        if: always() && hashFiles('moura-report/index.html') != ''
        uses: actions/upload-artifact@v4
        with:
          name: moura-report
          path: moura-report/
          retention-days: 14
          if-no-files-found: error

      - name: Moura self-check
        if: always() && steps.build.outcome == 'success'
        run: node dist/cli.js check . --strict-traceability

      - name: Write quality job summary
        run: pnpm quality:summary

      - name: Fixture check smoke
        run: node dist/cli.js check test/fixtures/passing-project

      - name: Check package contents
        run: pnpm pack --dry-run

      - name: Retrieve optional validated Japanese views
        if: github.repository == 'specxai/moura'
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm exec tsx scripts/fetch-japanese-views.ts

      - name: Assemble quality site
        run: pnpm quality:site

      - name: Upload quality site for PR review
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: quality-site
          path: _site/
          retention-days: 14
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        if: github.repository == 'specxai/moura' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site/

  deploy-pages:
    name: Deploy quality reports
    if: github.repository == 'specxai/moura' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event_name == 'workflow_run')
    needs:
      - quality
      - windows-smoke
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  windows-smoke:
    name: Windows report, package, and onboarding smoke
    if: >-
      github.event_name != 'workflow_run' ||
      (github.repository == 'specxai/moura' &&
       github.ref == 'refs/heads/main' &&
       github.event.workflow_run.repository.full_name == 'specxai/moura' &&
       github.event.workflow_run.head_repository.full_name == 'specxai/moura' &&
       github.event.workflow_run.path == '.github/workflows/japanese-views.yml' &&
       github.event.workflow_run.event == 'workflow_dispatch' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.status == 'completed' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.sha || '' }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Allure results
        run: pnpm test:allure

      - name: Generate Allure HTML report
        run: pnpm report:allure

      - name: Test installed package
        run: pnpm test:package

      - name: Test Vitest and Allure onboarding example
        run: pnpm test:onboarding
