name: Publish to npm

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release_version:
        description: Exact version already approved and published on npm (X.Y.Z)
        required: true
        type: string
      dist_tag:
        description: npm dist-tag expected to identify the release
        required: true
        default: latest
        type: string

jobs:
  publish:
    if: github.repository == 'specxai/moura' && github.event_name == 'release'
    outputs:
      release_version: ${{ steps.release-metadata.outputs.release_version }}
      dist_tag: ${{ steps.release-metadata.outputs.dist_tag }}
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install and verify publishing toolchain
        run: |
          npm install --global npm@11.15.0
          test "$(npm --version)" = "11.15.0"
          node --version
          npm --version

      - name: Verify release tag matches package version
        id: release-metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vX.Y.Z; received: $RELEASE_TAG" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          release_version="${RELEASE_TAG#v}"
          if [[ "$release_version" != "$package_version" ]]; then
            echo "Release tag version ($release_version) does not match package.json ($package_version)." >&2
            exit 1
          fi

          echo "release_version=$release_version" >> "$GITHUB_OUTPUT"
          echo "dist_tag=latest" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm build

      - name: Test installed package
        run: pnpm test:package

      - name: Check package contents
        run: pnpm pack --dry-run

      - name: Publish package
        env:
          DIST_TAG: ${{ steps.release-metadata.outputs.dist_tag }}
        run: npm publish --tag "$DIST_TAG"

  registry-smoke:
    name: Post-publish registry and onboarding verification
    needs: publish
    if: >-
      always() &&
      github.repository == 'specxai/moura' &&
      ((github.event_name == 'release' && needs.publish.result == 'success') ||
      github.event_name == 'workflow_dispatch')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released verification harness
        uses: actions/checkout@v4
        with:
          ref: refs/tags/v${{ github.event_name == 'release' && needs.publish.outputs.release_version || inputs.release_version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install verification harness dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the released registry artifact
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && needs.publish.outputs.release_version || inputs.release_version }}
          DIST_TAG: ${{ github.event_name == 'release' && needs.publish.outputs.dist_tag || inputs.dist_tag }}
        run: pnpm test:registry -- "$RELEASE_VERSION" "$DIST_TAG"

      - name: Summarize post-publish failure semantics
        if: failure()
        env:
          RELEASE_VERSION: ${{ github.event_name == 'release' && needs.publish.outputs.release_version || inputs.release_version }}
        run: |
          echo "::error::npm publication of @specxai/moura@$RELEASE_VERSION is not rolled back; post-publish registry/onboarding verification failed."
          echo "## Post-publish verification failed" >> "$GITHUB_STEP_SUMMARY"
          echo "The npm release already exists, but verification of the released registry artifact failed. Follow up on the published release." >> "$GITHUB_STEP_SUMMARY"
